<!-- tracker-test.html -->
<!DOCTYPE html>
<html>

<head>
    <title>Tracker Test</title>
</head>

<body>
    <h1>Testing WebTorrent Tracker Connectivity</h1>

    <div id="status">Loading WebTorrent...</div>
    <div id="log"></div>

    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');

        function addLog(message) {
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            log.appendChild(div);
            console.log(message);
        }

        async function testTracker() {
            addLog('Testing tracker: wss://tracker-0ad4cca9fd92.herokuapp.com');

            try {
                // Create client with just your tracker
                const client = new WebTorrent({
                    tracker: {
                        announce: ['wss://tracker-0ad4cca9fd92.herokuapp.com']
                    }
                });

                addLog('WebTorrent client created');

                // Create a test file to seed
                const testData = new Blob(['Hello P2P World!'], { type: 'text/plain' });

                client.seed(testData, { name: 'test-file.txt' }, (torrent) => {
                    addLog(`Seeding test torrent: ${torrent.name}`);
                    addLog(`Magnet URI: ${torrent.magnetURI}`);

                    // Monitor torrent events
                    torrent.on('trackerAnnounce', () => {
                        addLog('Announced to tracker');
                    });

                    torrent.on('wire', (wire) => {
                        addLog(`Connected to peer: ${wire.peerId?.substring(0, 8)}`);
                    });

                    torrent.on('warning', (warning) => {
                        addLog(`Warning: ${warning}`);
                    });

                    torrent.on('error', (error) => {
                        addLog(`Error: ${error.message}`);
                    });

                    // Check after 5 seconds
                    setTimeout(() => {
                        addLog(`After 5s - Peers: ${torrent.numPeers}, Progress: ${(torrent.progress * 100).toFixed(2)}%`);

                        if (torrent.numPeers === 0) {
                            addLog('❌ No peers found. Tracker might not be working.');
                            addLog('Check if tracker is running on Heroku...');
                        } else {
                            addLog('✅ P2P is working! Found peers.');
                        }
                    }, 5000);
                });

            } catch (error) {
                addLog(`❌ Error: ${error.message}`);
            }
        }

        // Run test when WebTorrent loads
        if (window.WebTorrent) {
            testTracker();
        } else {
            status.textContent = 'Waiting for WebTorrent to load...';
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js';
            script.onload = testTracker;
            document.head.appendChild(script);
        }
    </script>
</body>

</html>
